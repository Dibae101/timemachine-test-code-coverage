buildscript {
    repositories {
        // jcenter() was shut down in 2022. This public mirror still serves the
        // archived jcenter artifacts, which is what lets this 2020-era build
        // resolve its original dependency versions (incl. jacoco-android).
        maven { url "https://maven.aliyun.com/repository/public" }
        mavenCentral()
        google()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.3'
        classpath "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:2.8"
        classpath 'com.dicedmelon.gradle:jacoco-android:0.1.4'
    }
    // Exclude the version that the android plugin depends on.
    configurations.classpath.exclude group: 'com.android.tools.external.lombok'
}

allprojects {
    repositories {
        mavenLocal()
        // Archived-jcenter mirror first: sublimepickerlibrary and rxpermissions
        // exist nowhere else now.
        maven { url "https://maven.aliyun.com/repository/public" }
        mavenCentral()
        google()
        jcenter()
        maven {url "https://jitpack.io"}
        // NOTE: dl.bintray.com/tbruyelle is dead and now answers with an HTML
        // error page, which breaks Gradle's POM parser ("element type hr must
        // be terminated"). Removed deliberately.
    }
}

apply plugin: 'org.sonarqube'
sonarqube {
    properties {
        property "sonar.projectName", "Omni Notes"
        property "sonar.projectKey", "omni-notes"
        property 'sonar.projectVersion', project.VERSION_NAME
        property "sonar.host.url", "https://sonarcloud.io"
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.language', 'java'
        property 'sonar.test.exclusions', 'src/test/**,src/androidTest/**'
    }
}

