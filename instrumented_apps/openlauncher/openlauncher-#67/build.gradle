// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        maven { url 'https://maven.google.com' }
        mavenCentral()
        // Archived-jcenter mirror LAST: textdrawable, materialscrollbar and
        // SimpleFingerGestures exist nowhere else since jcenter shut down, but
        // this mirror is flaky (intermittent 502s), so let the reliable repos
        // answer first and fall back to it only for the jcenter-only artifacts.
        maven { url "https://maven.aliyun.com/repository/public" }
        jcenter()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.2.1'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:1.4.1'
        //classpath 'com.neenbedankt.gradle.plugins:android-apt:1.8'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.google.com' }
        mavenCentral()
        // Archived-jcenter mirror last, see note above.
        maven { url "https://maven.aliyun.com/repository/public" }
        jcenter()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
